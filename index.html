<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket buddy - fielder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: '#d2b48c',
                    }
                }
            }
        }
    </script>
    <style>
        .fielder { cursor: grab; transition: transform 0.1s ease-out; }
        .fielder:active { cursor: grabbing; }
        .fielder-label { font-size: 10px; pointer-events: none; user-select: none; font-weight: 600; text-shadow: 0px 0px 2px white; }
        .dark .fielder-label { text-shadow: 0px 0px 2px black; fill: white; }
        .locked { cursor: not-allowed; opacity: 0.8; }
        .field-container { touch-action: none; position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
        .ghost-preview { pointer-events: none; transition: opacity 0.2s; }
        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .vertical-text { writing-mode: vertical-rl; }
        
        /* Ensure no horizontal scroll */
        body { overflow-x: hidden; }
        
        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            .fielder-label { font-size: 9px; }
            .side-label { font-size: 8px !important; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 min-h-screen font-sans transition-colors duration-300">

<div class="w-full max-w-7xl mx-auto px-2 sm:px-4 py-4">
    <!-- Header: Centered Branding & Theme Toggle -->
    <div class="relative flex justify-center items-center mb-6 bg-white dark:bg-slate-800 p-4 sm:p-6 rounded-xl shadow-sm border border-transparent dark:border-slate-700">
        <div class="text-center">
            <h1 class="text-xl sm:text-3xl font-bold text-green-800 dark:text-green-400 tracking-tight leading-none">Cricket buddy - fielder</h1>
            <p class="text-[10px] sm:text-sm text-gray-500 dark:text-gray-400 mt-2 font-medium">Tactical planning for international formations & player profiles.</p>
        </div>
        <div class="absolute right-4 top-1/2 -translate-y-1/2">
            <button id="themeToggle" class="p-2 rounded-full bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-yellow-400 hover:ring-2 ring-green-500 transition" title="Toggle Light/Dark Mode">
                <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h1m-16 0H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l.707.707M6.343 6.343l.707-.707M14.5 12a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path></svg>
                <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>
    </div>

    <div id="mainWrapper" class="w-full">
        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
            
            <!-- 1. Position Library (Left on PC, Bottom on Mobile) -->
            <div class="order-3 lg:order-1 lg:col-span-3 bg-white dark:bg-slate-800 p-3 sm:p-5 rounded-xl shadow-md h-[400px] lg:h-[600px] flex flex-col border border-transparent dark:border-slate-700">
                <h2 class="font-bold text-gray-700 dark:text-gray-200 border-b dark:border-slate-700 pb-2 mb-3 text-sm">Position Library</h2>
                <div id="positionList" class="flex-1 overflow-y-auto custom-scroll space-y-1 pr-1">
                    <!-- Buttons injected by JS -->
                </div>
            </div>

            <!-- 2. Visualization Canvas (Middle on PC, Top on Mobile) -->
            <div class="order-1 lg:order-2 lg:col-span-6 bg-white dark:bg-slate-800 p-2 sm:p-4 rounded-xl shadow-md relative overflow-hidden flex flex-col items-center border border-transparent dark:border-slate-700">
                <!-- Side Labels -->
                <div id="sideLabelLeft" class="side-label absolute top-1/2 left-1 sm:left-4 -translate-y-1/2 text-[8px] sm:text-[10px] font-black text-gray-400 dark:text-gray-600 uppercase vertical-text tracking-widest rotate-180">Off Side</div>
                <div id="sideLabelRight" class="side-label absolute top-1/2 right-1 sm:right-4 -translate-y-1/2 text-[8px] sm:text-[10px] font-black text-gray-400 dark:text-gray-600 uppercase vertical-text tracking-widest">Leg Side</div>
                
                <div class="field-container">
                    <svg id="fieldSvg" viewBox="0 0 500 500" class="w-full h-auto drop-shadow-lg touch-none">
                        <!-- Ground -->
                        <circle cx="250" cy="250" r="240" fill="#2d5a27" stroke="#1a3a16" stroke-width="4" />
                        <defs>
                            <pattern id="grassPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                <rect width="40" height="20" fill="#356a2e" />
                                <rect y="20" width="40" height="20" fill="#2d5a27" />
                            </pattern>
                        </defs>
                        <circle cx="250" cy="250" r="238" fill="url(#grassPattern)" opacity="0.4" />

                        <!-- Boundary & 30-yard -->
                        <circle cx="250" cy="250" r="230" fill="none" stroke="white" stroke-width="2" />
                        <circle cx="250" cy="250" r="110" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="8,5" />

                        <!-- Pitch -->
                        <rect x="235" y="190" width="30" height="120" rx="2" fill="#d2b48c" stroke="#8b4513" stroke-width="1" />
                        <line x1="235" y1="205" x2="265" y2="205" stroke="white" stroke-width="1" /> 
                        <line x1="235" y1="295" x2="265" y2="295" stroke="white" stroke-width="1" />

                        <!-- Batter Indicator -->
                        <g id="batterIcon" transform="translate(250, 205)">
                            <circle cx="0" cy="0" r="4" fill="#1e293b" class="dark:fill-slate-200" /> 
                            <path id="batterBat" d="M 0,0 L -8,8" stroke="#8b4513" stroke-width="2" stroke-linecap="round" />
                        </g>

                        <!-- Ghost Preview Element -->
                        <g id="ghostGroup" class="ghost-preview" opacity="0">
                            <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2" />
                            <circle cx="0" cy="0" r="6" fill="#fbbf24" opacity="0.6" />
                            <text id="ghostText" y="24" text-anchor="middle" class="fielder-label" fill="#fbbf24"></text>
                        </g>

                        <!-- Layers for fielders -->
                        <g id="fielderGroup"></g>
                    </svg>
                </div>
                <div id="statusMsg" class="mt-2 text-[10px] sm:text-xs font-medium text-gray-400 dark:text-gray-500 h-4 text-center"></div>
            </div>

            <!-- 3. Strategy & Control Panel (Right on PC, Middle on Mobile) -->
            <div class="order-2 lg:order-3 lg:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-xl shadow-md space-y-4 border border-transparent dark:border-slate-700">
                    <h2 class="font-bold text-sm sm:text-base text-gray-700 dark:text-gray-200 border-b dark:border-slate-700 pb-2 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Strategies
                    </h2>
                    
                    <!-- Batting Stance -->
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-2">Batting Stance</label>
                        <div class="flex p-1 bg-gray-100 dark:bg-slate-700 rounded-lg">
                            <button id="btnRHB" class="flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all shadow-sm bg-blue-600 text-white">RHB</button>
                            <button id="btnLHB" class="flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-600">LHB</button>
                        </div>
                    </div>

                    <!-- Standard Formations -->
                    <div class="space-y-2">
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase mb-1">Standard Formations</label>
                        <select id="standardFormation" class="w-full p-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg text-xs outline-none focus:ring-2 focus:ring-green-500 font-semibold">
                            <option value="">-- Select Formation --</option>
                            <option value="umbrella">Umbrella (Swing/Seam)</option>
                            <option value="bodyline">Bodyline Trap (Short Ball)</option>
                            <option value="ring">Classic Ring (Singles/ODI)</option>
                            <option value="death">Death Overs (Spread)</option>
                            <option value="spin_box">The 'Box' (Spin Attack)</option>
                            <option value="leg_trap">Leg-side Squeeze</option>
                        </select>
                        <button id="clearFormationBtn" class="w-full py-1.5 bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-slate-600 transition text-[9px] font-bold uppercase border border-gray-200 dark:border-slate-600">
                            Reset Formation
                        </button>
                    </div>

                    <!-- Visual Separator -->
                    <div class="relative flex items-center py-1">
                        <div class="flex-grow border-t border-gray-100 dark:border-slate-700"></div>
                        <span class="flex-shrink mx-4 text-[10px] font-black text-gray-300 dark:text-gray-600 uppercase tracking-tighter">OR</span>
                        <div class="flex-grow border-t border-gray-100 dark:border-slate-700"></div>
                    </div>

                    <!-- Profile-Based Logic -->
                    <div class="space-y-3">
                        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase">Profile Logic</label>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-400 dark:text-gray-500 uppercase mb-1">Bowler</label>
                                <select id="bowlerType" class="w-full p-1.5 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg text-[10px] outline-none focus:ring-2 focus:ring-green-500">
                                    <option value="pace">Fast</option>
                                    <option value="off_spin">Off-Spin</option>
                                    <option value="leg_spin">Leg-Spin</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-gray-400 dark:text-gray-500 uppercase mb-1">Batter</label>
                                <select id="batterStyle" class="w-full p-1.5 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg text-[10px] outline-none focus:ring-2 focus:ring-green-500">
                                    <option value="attacking">Attack</option>
                                    <option value="defensive">Defend</option>
                                    <option value="tailender">Tail</option>
                                </select>
                            </div>
                        </div>
                        <button id="applyStrategy" class="w-full py-2 bg-green-700 text-white rounded-lg font-bold text-xs shadow-md hover:bg-green-800 transition transform active:scale-95">
                            Apply Logic
                        </button>
                    </div>

                    <div class="pt-2 border-t dark:border-slate-700">
                        <button id="resetBtn" class="w-full py-1.5 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-100 dark:hover:bg-red-900/40 transition text-[10px] font-bold uppercase">Reset All Settings</button>
                    </div>
                </div>

                <!-- Fielder Counter -->
                <div class="bg-slate-800 dark:bg-black text-white p-3 sm:p-5 rounded-xl shadow-md border border-slate-700">
                    <div class="flex justify-between items-end">
                        <div>
                            <div class="text-[9px] uppercase opacity-60 font-bold tracking-tight">Fielders</div>
                            <div class="text-xl sm:text-2xl font-black"><span id="fielderCount">0</span> <span class="text-sm sm:text-lg opacity-40 font-normal">/ 9</span></div>
                        </div>
                        <div class="text-right">
                            <div id="strategyTag" class="px-2 py-0.5 bg-green-600 rounded text-[8px] font-bold uppercase mb-1 text-white truncate max-w-[100px]">Custom</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <footer class="mt-8 mb-6 text-center border-t dark:border-slate-800 pt-6">
            <p class="text-[10px] sm:text-xs text-gray-400 dark:text-gray-600 font-medium tracking-wide">
                Created by 
                <a href="mailto:raghunathsawant@duck.com" class="text-green-600 dark:text-green-500 hover:text-green-500 transition underline decoration-dotted font-bold">raghunathsawant@duck.com</a>
            </p>
        </footer>
    </div>
</div>

<script>
    const fieldSvg = document.getElementById('fieldSvg');
    const fielderGroup = document.getElementById('fielderGroup');
    const ghostGroup = document.getElementById('ghostGroup');
    const ghostText = document.getElementById('ghostText');
    const batterBat = document.getElementById('batterBat');
    const btnRHB = document.getElementById('btnRHB');
    const btnLHB = document.getElementById('btnLHB');
    const bowlerTypeSelect = document.getElementById('bowlerType');
    const batterStyleSelect = document.getElementById('batterStyle');
    const formationSelect = document.getElementById('standardFormation');
    const clearFormationBtn = document.getElementById('clearFormationBtn');
    const applyStrategyBtn = document.getElementById('applyStrategy');
    const positionList = document.getElementById('positionList');
    const fielderCountEl = document.getElementById('fielderCount');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const strategyTag = document.getElementById('strategyTag');
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'cricket-buddy-fielder';

    const FIXED_FIELDERS = [
        { id: 'wk', label: 'WK', x: 250, y: 175, color: '#dc2626', locked: true }
    ];

    const MASTER_POSITIONS = [
        { id: 'slip1', label: '1st Slip', x: 235, y: 170 },
        { id: 'slip2', label: '2nd Slip', x: 220, y: 165 },
        { id: 'slip3', label: '3rd Slip', x: 205, y: 160 },
        { id: 'slip4', label: '4th Slip', x: 190, y: 155 },
        { id: 'slip5', label: '5th Slip', x: 175, y: 150 },
        { id: 'gully', label: 'Gully', x: 185, y: 180 },
        { id: 'point', label: 'Point', x: 150, y: 205 },
        { id: 'b_point', label: 'Backward Point', x: 150, y: 185 },
        { id: 'cover', label: 'Cover', x: 150, y: 260 },
        { id: 'extra_cover', label: 'Extra Cover', x: 190, y: 285 },
        { id: 'mid_off', label: 'Mid-off', x: 220, y: 305 },
        { id: 'mid_on', label: 'Mid-on', x: 280, y: 305 },
        { id: 'mid_wicket', label: 'Mid-wicket', x: 320, y: 285 },
        { id: 'sq_leg', label: 'Square Leg', x: 350, y: 205 },
        { id: 'b_sq_leg', label: 'Backward Sq Leg', x: 350, y: 185 },
        { id: 'fine_leg', label: 'Fine Leg', x: 315, y: 150 },
        { id: 'third_man', label: 'Third Man', x: 160, y: 130 },
        { id: 'deep_point', label: 'Deep Point', x: 60, y: 205 },
        { id: 'deep_cover', label: 'Deep Cover', x: 80, y: 300 },
        { id: 'long_off', x: 210, y: 450, label: 'Long-off' },
        { id: 'long_on', x: 290, y: 450, label: 'Long-on' },
        { id: 'deep_mid_wicket', x: 400, y: 360, label: 'Deep Mid-wicket' },
        { id: 'deep_sq_leg', x: 420, y: 205, label: 'Deep Square Leg' },
        { id: 'long_leg', x: 380, y: 100, label: 'Long Leg' },
        { id: 'silly_point', x: 225, y: 215, label: 'Silly Point' },
        { id: 'short_leg', x: 275, y: 215, label: 'Short Leg' },
        { id: 'silly_mid_off', x: 225, y: 240, label: 'Silly Mid-off' },
        { id: 'silly_mid_on', x: 275, y: 240, label: 'Silly Mid-on' },
        { id: 'leg_slip', x: 265, y: 170, label: 'Leg Slip' },
        { id: 'leg_gully', x: 280, y: 185, label: 'Leg Gully' }
    ];

    let isRHB = true;
    let selectedFielders = [];
    let bowler = { id: 'bowler', label: 'Bowler', x: 250, y: 315, color: '#dc2626', locked: false };

    const STRATEGY_DATA = {
        'pace_attacking': ['slip1', 'slip2', 'slip3', 'gully', 'point', 'mid_off', 'mid_on', 'fine_leg', 'short_leg'],
        'pace_defensive': ['third_man', 'deep_point', 'long_off', 'long_on', 'deep_mid_wicket', 'fine_leg', 'extra_cover', 'mid_wicket', 'cover'],
        'pace_tailender': ['slip1', 'slip2', 'gully', 'short_leg', 'silly_point', 'mid_off', 'mid_on', 'point', 'sq_leg'],
        'off_spin_attacking': ['slip1', 'silly_point', 'short_leg', 'mid_wicket', 'mid_on', 'mid_off', 'point', 'sq_leg', 'fine_leg'],
        'off_spin_defensive': ['long_on', 'long_off', 'deep_mid_wicket', 'deep_sq_leg', 'point', 'extra_cover', 'mid_wicket', 'fine_leg', 'cover'],
        'off_spin_tailender': ['silly_point', 'short_leg', 'silly_mid_off', 'silly_mid_on', 'slip1', 'point', 'mid_wicket', 'mid_off', 'mid_on'],
        'leg_spin_attacking': ['slip1', 'leg_slip', 'silly_mid_on', 'mid_wicket', 'sq_leg', 'point', 'mid_off', 'cover', 'fine_leg'],
        'leg_spin_defensive': ['deep_mid_wicket', 'long_on', 'long_off', 'deep_point', 'deep_cover', 'mid_wicket', 'sq_leg', 'fine_leg', 'extra_cover'],
        'leg_spin_tailender': ['leg_slip', 'silly_mid_on', 'short_leg', 'slip1', 'point', 'mid_wicket', 'mid_on', 'mid_off', 'silly_mid_off']
    };

    const ICONIC_FORMATIONS = {
        'umbrella': ['slip1', 'slip2', 'slip3', 'slip4', 'slip5', 'gully', 'point', 'mid_off', 'mid_on'],
        'bodyline': ['leg_slip', 'leg_gully', 'b_sq_leg', 'sq_leg', 'short_leg', 'mid_wicket', 'mid_on', 'mid_off', 'fine_leg'],
        'ring': ['point', 'cover', 'extra_cover', 'mid_off', 'mid_on', 'mid_wicket', 'sq_leg', 'b_point', 'b_sq_leg'],
        'death': ['long_off', 'long_on', 'deep_mid_wicket', 'deep_sq_leg', 'deep_point', 'deep_cover', 'fine_leg', 'point', 'mid_off'],
        'spin_box': ['slip1', 'silly_point', 'silly_mid_off', 'silly_mid_on', 'short_leg', 'mid_wicket', 'mid_on', 'point', 'mid_off'],
        'leg_trap': ['leg_slip', 'leg_gully', 'short_leg', 'sq_leg', 'mid_wicket', 'mid_on', 'long_on', 'deep_sq_leg', 'mid_off']
    };

    function initTheme() {
        const savedTheme = localStorage.getItem(`${appId}_theme`) || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        }
    }

    themeToggle.onclick = () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(`${appId}_theme`, isDark ? 'dark' : 'light');
        sunIcon.classList.toggle('hidden');
        moonIcon.classList.toggle('hidden');
    };

    function init() {
        initTheme();
        renderPositionList();
        loadIconicFormation('umbrella');
        setupListeners();
    }

    function renderPositionList() {
        positionList.innerHTML = '';
        const sortedPositions = [...MASTER_POSITIONS].sort((a, b) => {
            const aSelected = isFielderSelected(a.id);
            const bSelected = isFielderSelected(b.id);
            if (aSelected && !bSelected) return -1;
            if (!aSelected && bSelected) return 1;
            return a.label.localeCompare(b.label);
        });

        sortedPositions.forEach(pos => {
            const btn = document.createElement('button');
            const isSelected = isFielderSelected(pos.id);
            btn.className = `w-full text-left px-3 py-2 rounded-lg text-[10px] transition flex justify-between items-center group
                ${isSelected ? 'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300 font-bold border-l-4 border-green-500' : 'bg-gray-50 dark:bg-slate-700 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-600 border-l-4 border-transparent'}`;
            btn.innerHTML = `<span>${pos.label}</span><span class="opacity-0 group-hover:opacity-100">${isSelected ? '✕' : '+'}</span>`;
            btn.onclick = () => toggleFielder(pos);
            btn.onmouseenter = () => showGhost(pos);
            btn.onmouseleave = hideGhost;
            positionList.appendChild(btn);
        });
        fielderCountEl.textContent = selectedFielders.length;
    }

    function showGhost(pos) {
        if (isFielderSelected(pos.id)) return;
        const targetX = isRHB ? pos.x : 500 - pos.x;
        ghostGroup.setAttribute('transform', `translate(${targetX}, ${pos.y})`);
        ghostText.textContent = pos.label;
        ghostGroup.setAttribute('opacity', '1');
    }

    function hideGhost() { ghostGroup.setAttribute('opacity', '0'); }
    function isFielderSelected(id) { return selectedFielders.some(f => f.id === id); }

    function toggleFielder(pos) {
        if (isFielderSelected(pos.id)) {
            selectedFielders = selectedFielders.filter(f => f.id !== pos.id);
        } else {
            if (selectedFielders.length >= 9) {
                showStatus("9 fielders max");
                return;
            }
            const newFielder = { ...pos, color: '#3b82f6' };
            if (!isRHB) newFielder.x = 500 - newFielder.x;
            selectedFielders.push(newFielder);
            hideGhost();
        }
        strategyTag.textContent = "Custom";
        strategyTag.className = "px-2 py-0.5 bg-gray-500 rounded text-[8px] font-bold uppercase mb-1 text-white truncate max-w-[100px]";
        formationSelect.value = "";
        renderPositionList();
        renderField();
    }

    function renderField() {
        fielderGroup.innerHTML = '';
        const allPlayers = [...FIXED_FIELDERS, bowler, ...selectedFielders];
        allPlayers.forEach(f => {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('class', f.locked ? 'fielder locked' : 'fielder');
            g.setAttribute('data-id', f.id);
            g.setAttribute('transform', `translate(${f.x}, ${f.y})`);
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('r', '9');
            circle.setAttribute('fill', f.color || '#3b82f6');
            circle.setAttribute('stroke', '#fff');
            circle.setAttribute('stroke-width', '2');
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('class', 'fielder-label');
            text.setAttribute('y', '20');
            text.setAttribute('text-anchor', 'middle');
            text.textContent = f.label;
            g.appendChild(circle);
            g.appendChild(text);
            fielderGroup.appendChild(g);
            if (!f.locked) {
                g.addEventListener('mousedown', startDrag);
                g.addEventListener('touchstart', startDrag, { passive: false });
            }
        });
    }

    let draggingId = null;
    let offset = { x: 0, y: 0 };

    function startDrag(e) {
        e.preventDefault();
        const evt = e.type === 'touchstart' ? e.touches[0] : e;
        draggingId = e.currentTarget.getAttribute('data-id');
        const CTM = fieldSvg.getScreenCTM();
        const pt = fieldSvg.createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        const svgPt = pt.matrixTransform(CTM.inverse());
        let target = draggingId === 'bowler' ? bowler : selectedFielders.find(f => f.id === draggingId);
        if (!target) return;
        offset.x = svgPt.x - target.x;
        offset.y = svgPt.y - target.y;
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    }

    function drag(e) {
        if (!draggingId) return;
        const evt = e.type === 'touchmove' ? e.touches[0] : e;
        const CTM = fieldSvg.getScreenCTM();
        const pt = fieldSvg.createSVGPoint();
        pt.x = evt.clientX; pt.y = evt.clientY;
        const svgPt = pt.matrixTransform(CTM.inverse());
        let target = draggingId === 'bowler' ? bowler : selectedFielders.find(f => f.id === draggingId);
        if (!target) return;
        target.x = svgPt.x - offset.x;
        if (draggingId !== 'bowler') target.y = svgPt.y - offset.y;
        if (draggingId === 'bowler') {
            target.x = Math.max(220, Math.min(280, target.x)); 
        } else {
            const dist = Math.sqrt(Math.pow(target.x - 250, 2) + Math.pow(target.y - 250, 2));
            if (dist > 230) {
                const angle = Math.atan2(target.y - 250, target.x - 250);
                target.x = 250 + 230 * Math.cos(angle);
                target.y = 250 + 230 * Math.sin(angle);
            }
        }
        const g = fielderGroup.querySelector(`[data-id="${draggingId}"]`);
        g.setAttribute('transform', `translate(${target.x}, ${target.y})`);
    }

    function endDrag() {
        draggingId = null;
        document.removeEventListener('mousemove', drag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', drag);
        document.removeEventListener('touchend', endDrag);
    }

    function loadIconicFormation(formationKey) {
        const positionIds = ICONIC_FORMATIONS[formationKey];
        if (positionIds) {
            selectedFielders = positionIds.map(id => {
                const base = MASTER_POSITIONS.find(p => p.id === id);
                const pos = { ...base, color: '#3b82f6' };
                if (!isRHB) pos.x = 500 - pos.x;
                return pos;
            });
            strategyTag.textContent = formationKey.replace('_', ' ');
            strategyTag.className = "px-2 py-0.5 bg-blue-700 rounded text-[8px] font-bold uppercase mb-1 text-white truncate max-w-[100px]";
            renderPositionList();
            renderField();
            showStatus(`Applied formation`);
        }
    }

    function generateTacticalField() {
        const bowType = bowlerTypeSelect.value;
        const batStyle = batterStyleSelect.value;
        const key = `${bowType}_${batStyle}`;
        const positionIds = STRATEGY_DATA[key];
        if (positionIds) {
            selectedFielders = positionIds.map(id => {
                const base = MASTER_POSITIONS.find(p => p.id === id);
                const pos = { ...base, color: '#3b82f6' };
                if (!isRHB) pos.x = 500 - pos.x;
                return pos;
            });
            strategyTag.textContent = `${bowType.substring(0,4)} vs ${batStyle.substring(0,4)}`;
            strategyTag.className = "px-2 py-0.5 bg-green-600 rounded text-[8px] font-bold uppercase mb-1 text-white truncate max-w-[100px]";
            formationSelect.value = "";
            renderPositionList();
            renderField();
            showStatus("Applied profiles");
        }
    }

    function updateOrientation(isRH) {
        if (isRHB === isRH) return;
        isRHB = isRH;
        if (isRHB) {
            btnRHB.className = "flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all shadow-sm bg-blue-600 text-white";
            btnLHB.className = "flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-600";
            batterBat.setAttribute('d', 'M 0,0 L -8,8'); 
            document.getElementById('sideLabelLeft').textContent = 'Off Side';
            document.getElementById('sideLabelRight').textContent = 'Leg Side';
        } else {
            btnLHB.className = "flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all shadow-sm bg-blue-600 text-white";
            btnRHB.className = "flex-1 py-1.5 px-3 rounded-md text-xs font-bold transition-all text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-600";
            batterBat.setAttribute('d', 'M 0,0 L 8,8'); 
            document.getElementById('sideLabelLeft').textContent = 'Leg Side';
            document.getElementById('sideLabelRight').textContent = 'Off Side';
        }
        selectedFielders.forEach(f => { f.x = 500 - f.x; });
        bowler.x = 500 - bowler.x;
        renderField();
        renderPositionList();
    }

    function setupListeners() {
        btnRHB.onclick = () => updateOrientation(true);
        btnLHB.onclick = () => updateOrientation(false);
        applyStrategyBtn.onclick = generateTacticalField;
        formationSelect.onchange = (e) => { if (e.target.value) loadIconicFormation(e.target.value); };
        clearFormationBtn.onclick = () => {
            selectedFielders = [];
            formationSelect.value = "";
            strategyTag.textContent = "Custom";
            strategyTag.className = "px-2 py-0.5 bg-gray-500 rounded text-[8px] font-bold uppercase mb-1 text-white truncate max-w-[100px]";
            renderPositionList(); renderField(); showStatus("Cleared");
        };
        resetBtn.onclick = () => {
            selectedFielders = []; bowler.x = 250; isRHB = true; updateOrientation(true);
            formationSelect.value = ""; renderPositionList(); renderField(); showStatus("Reset");
        };
    }

    function showStatus(msg) {
        statusMsg.textContent = msg;
        setTimeout(() => { if(statusMsg.textContent === msg) statusMsg.textContent = ''; }, 2000);
    }
    window.onload = init;
</script>

</body>
